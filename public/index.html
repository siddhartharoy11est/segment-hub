<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Segment Hub: internal API for targeting segments</title>
<style>
:root{--bg:#f6f7f9;--card:#fff;--ink:#1b2430;--mut:#5d6b7c;--line:#dfe3e8;--acc:#1f5eff;--acc-ink:#fff;
--ok:#14803c;--ok-bg:#e3f5e9;--warn:#946200;--warn-bg:#fff3d6;--bad:#b3261e;--bad-bg:#fde7e5;--info:#1f5eff;--info-bg:#e6edff;--code:#f0f2f5}
@media (prefers-color-scheme:dark){:root{--bg:#12161c;--card:#1a2029;--ink:#e6eaf0;--mut:#9aa7b8;--line:#2b3441;--acc:#6b95ff;--acc-ink:#0b1220;
--ok:#59d68a;--ok-bg:#16301f;--warn:#f0c15a;--warn-bg:#3a2e12;--bad:#ff8c84;--bad-bg:#3b1a18;--info:#8fb0ff;--info-bg:#1b2742;--code:#222a35}}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 system-ui,-apple-system,Segoe UI,Roboto,sans-serif}
header{padding:14px 20px;border-bottom:1px solid var(--line);background:var(--card);display:flex;flex-wrap:wrap;gap:12px;align-items:center;justify-content:space-between}
header h1{font-size:18px;margin:0}
header .sub{color:var(--mut);font-size:13px}
.ctl{display:flex;flex-wrap:wrap;gap:8px;align-items:center;font-size:13px}
select,input,textarea,button{font:inherit;color:inherit}
select,input[type=text],textarea{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 8px}
textarea{width:100%;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:12.5px;line-height:1.45}
button{background:var(--card);border:1px solid var(--line);border-radius:8px;padding:6px 11px;cursor:pointer}
button:hover{border-color:var(--acc)}
button.pri{background:var(--acc);color:var(--acc-ink);border-color:var(--acc)}
button.sm{padding:3px 8px;font-size:12.5px}
button:disabled{opacity:.5;cursor:default}
nav{display:flex;gap:4px;padding:8px 20px 0;overflow-x:auto;border-bottom:1px solid var(--line);background:var(--card)}
nav button{border:0;border-bottom:3px solid transparent;border-radius:0;background:none;padding:9px 12px;white-space:nowrap;color:var(--mut)}
nav button.on{color:var(--ink);border-bottom-color:var(--acc);font-weight:600}
main{max-width:1100px;margin:0 auto;padding:18px 20px 90px}
h2{font-size:17px;margin:0 0 4px}
h3{font-size:14px;margin:14px 0 6px}
p.lead{color:var(--mut);margin:2px 0 14px}
.card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 16px;margin:0 0 12px}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}
.grid{display:grid;gap:12px}
.g2{grid-template-columns:repeat(auto-fit,minmax(300px,1fr))}
.g4{grid-template-columns:repeat(auto-fit,minmax(170px,1fr))}
.chip{display:inline-block;padding:2px 9px;border-radius:999px;font-size:12px;font-weight:600;white-space:nowrap}
.good{background:var(--ok-bg);color:var(--ok)}.warn{background:var(--warn-bg);color:var(--warn)}.bad{background:var(--bad-bg);color:var(--bad)}.info{background:var(--info-bg);color:var(--info)}.grey{background:var(--code);color:var(--mut)}
.tile{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 14px}
.tile b{display:block;font-size:24px;line-height:1.2}.tile span{color:var(--mut);font-size:12.5px}
pre{background:var(--code);border-radius:8px;padding:10px;overflow:auto;font:12px/1.45 ui-monospace,Menlo,Consolas,monospace;margin:6px 0;max-height:340px}
table{border-collapse:collapse;width:100%;font-size:13.5px}
th,td{text-align:left;padding:7px 8px;border-bottom:1px solid var(--line);vertical-align:top}
th{color:var(--mut);font-weight:600;font-size:12px}
.scroll{overflow-x:auto}
.verdict{border-radius:10px;padding:10px 12px;margin:8px 0;font-weight:600}
.verdict.good{background:var(--ok-bg);color:var(--ok)}.verdict.warn{background:var(--warn-bg);color:var(--warn)}.verdict.bad{background:var(--bad-bg);color:var(--bad)}.verdict.info{background:var(--info-bg);color:var(--info)}
.muted{color:var(--mut)}.small{font-size:12.5px}
details>summary{cursor:pointer;color:var(--mut);font-size:13px;margin:6px 0}
.toast{position:fixed;right:14px;top:14px;max-width:420px;padding:10px 14px;border-radius:10px;font-size:13.5px;box-shadow:0 6px 24px rgba(0,0,0,.25);z-index:50}
footer{position:fixed;left:0;right:0;bottom:0;background:var(--card);border-top:1px solid var(--line);padding:6px 20px;font-size:12.5px;z-index:20;max-height:50vh;overflow:auto}
footer .calls{display:flex;flex-direction:column;gap:2px;margin-top:6px}
footer .call{cursor:pointer;display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.mono{font-family:ui-monospace,Menlo,Consolas,monospace}
.two{display:grid;grid-template-columns:1fr 1fr;gap:10px}
body.logopen main{padding-bottom:56vh}
.exwrap{display:grid;grid-template-columns:minmax(230px,300px) 1fr;gap:12px;margin-bottom:12px;align-items:start}
.exlist{display:flex;flex-direction:column;gap:6px}
.exitem{display:flex;gap:10px;align-items:flex-start;text-align:left;padding:8px 10px}
.exitem.on{border-color:var(--acc);background:var(--info-bg)}
.exnum{flex:none;width:22px;height:22px;border-radius:50%;background:var(--code);display:inline-flex;align-items:center;justify-content:center;font-weight:700;font-size:12px}
.exitem.on .exnum{background:var(--acc);color:var(--acc-ink)}
.exguide{margin:0}
.exguide dl{margin:0;display:grid;grid-template-columns:110px 1fr;gap:6px 12px;font-size:13.5px}
.exguide dt{color:var(--mut);font-weight:600;font-size:12.5px}
.exguide dd{margin:0}
@media(max-width:640px){.exwrap{grid-template-columns:1fr}.exguide dl{grid-template-columns:1fr}.exguide dd{margin-bottom:6px}.two{grid-template-columns:1fr}header{padding:12px}main{padding:14px 12px 90px}}
</style>
</head>
<body>
<header>
  <div>
    <h1>Segment Hub</h1>
    <div class="sub">Internal API for targeting segments. A control-plane prototype for the Media.net APM case.</div>
  </div>
  <div class="ctl">
    <span id="mode" class="chip grey">connecting</span>
    <label>Acting as <select id="actor"></select></label>
    <span class="muted" id="clock"></span>
    <button id="reset" class="sm">Reset demo</button>
  </div>
</header>
<nav id="tabs"></nav>
<main id="view"></main>
<footer id="log"></footer>

<script src="engine.js"></script>
<script src="suite.js"></script>
<script src="about.js"></script>
<script>
(function () {
  'use strict';
  var MODE = 'sim', hub = null, WAKE_READY = false;
  var state = { tab: 'about', about: {}, token: 'tok_priya_adops', replay: null, segId: null, sync: null, syncSeg: 'seg_glowroot_festive_east', dstate: null, radius: null, scen: {}, builder: '', tests: null, explorer: null, logOpen: false, logSel: null };
  var LOG = [];

  // ---------------------------------------------------------------- helpers
  function h(tag, attrs) {
    var e = document.createElement(tag), kids = Array.prototype.slice.call(arguments, 2);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (k === 'class') e.className = v;
      else if (k === 'style') e.style.cssText = v;
      else if (k === 'value') e.value = v;
      else if (k.slice(0, 2) === 'on') e.addEventListener(k.slice(2), v);
      else if (v !== false && v != null) e.setAttribute(k, v === true ? '' : v);
    });
    (function add(list) { list.forEach(function (c) { if (Array.isArray(c)) return add(c); if (c == null || c === false) return; e.append(c.nodeType ? c : document.createTextNode(String(c))); }); })(kids);
    return e;
  }
  function chip(text, tone) { return h('span', { class: 'chip ' + (tone || 'grey') }, text); }
  function pre(obj) { return h('pre', {}, typeof obj === 'string' ? obj : JSON.stringify(obj, null, 2)); }
  function fmtSecs(s) {
    if (s == null) return 'n/a';
    if (s <= 0) return 'expired';
    var hh = Math.floor(s / 3600), mm = Math.floor((s % 3600) / 60), ss = s % 60;
    return hh ? hh + 'h ' + mm + 'm' : mm ? mm + 'm ' + (ss < 10 ? '0' : '') + ss + 's' : ss + 's';
  }
  function uid() { return 'ui-' + Math.random().toString(36).slice(2, 10); }
  function toast(msg, tone) {
    var t = h('div', { class: 'toast ' + (tone === 'bad' ? 'bad' : tone === 'good' ? 'good' : 'info') }, msg);
    document.body.append(t); setTimeout(function () { t.remove(); }, tone === 'bad' ? 7000 : 3800);
  }
  function actorLabel(tok) { var t = (state.dstate ? state.dstate.tokens : []).filter(function (x) { return x.token === tok; })[0]; return t ? t.label : tok; }
  function errText(r) { var b = r.body || {}; return r.status + ' ' + (b.error || '') + (b.message ? ': ' + b.message : ''); }

  // ---------------------------------------------------------------- api
  async function api(method, path, opts) {
    opts = opts || {};
    var token = opts.token === undefined ? state.token : opts.token;
    var headers = Object.assign({}, token ? { authorization: 'Bearer ' + token } : {}, opts.headers || {});
    var t0 = performance.now(), res;
    var qs = opts.query && Object.keys(opts.query).length ? '?' + new URLSearchParams(opts.query).toString() : '';
    if (MODE === 'live') {
      var init = { method: method, headers: Object.assign({ 'content-type': 'application/json' }, headers) };
      if (opts.body !== undefined) init.body = JSON.stringify(opts.body);
      var r = await fetch(path + qs, init), text = await r.text(), body = null;
      try { body = text ? JSON.parse(text) : null; } catch (e) { body = text; }
      var hd = {}; r.headers.forEach(function (v, k) { hd[k] = v; });
      res = { status: r.status, headers: hd, body: body, redirected: r.redirected, url: r.url };
    } else {
      var out = hub.handle({ method: method, path: path, query: opts.query || {}, headers: headers, body: opts.body === undefined ? undefined : JSON.parse(JSON.stringify(opts.body)) });
      res = { status: out.status, headers: out.headers || {}, body: out.body === undefined ? null : JSON.parse(JSON.stringify(out.body)) };
    }
    res.ms = Math.max(1, Math.round(performance.now() - t0));
    LOG.unshift({ method: method, path: path + qs, who: token ? actorLabel(token) : 'no token (demo control)', reqBody: opts.body, res: res, at: new Date() });
    if (LOG.length > 40) LOG.length = 40;
    renderLog();
    return res;
  }
  async function detect() {
    if (!/^https?:$/.test(location.protocol)) { MODE = 'sim'; hub = SegmentHub.createHub({ seed: true }); return; }
    try {
      var ctl = new AbortController(); setTimeout(function () { ctl.abort(); }, 1500);
      var r = await fetch('/v1/health', { signal: ctl.signal }), j = await r.json();
      if (j && j.service === 'segment-hub') { MODE = 'live'; return; }
    } catch (e) { /* fall through */ }
    MODE = 'sim'; hub = SegmentHub.createHub({ seed: true });
    // A free-tier server can take 30 to 60 s to wake. Start in simulation right away, keep checking, and offer a switch when it answers.
    var tries = 0, timer = setInterval(async function () {
      tries++; if (tries > 40) { clearInterval(timer); return; }
      try {
        var c2 = new AbortController(); setTimeout(function () { c2.abort(); }, 4000);
        var r2 = await fetch('/v1/health', { signal: c2.signal }), j2 = await r2.json();
        if (j2 && j2.service === 'segment-hub') { clearInterval(timer); WAKE_READY = true; renderChrome(); }
      } catch (e) { /* still asleep */ }
    }, 5000);
  }
  async function refreshDemo() { var r = await api('GET', '/v1/demo/state', { token: null }); state.dstate = r.body; renderChrome(); }

  // ---------------------------------------------------------------- chrome
  var TABS = [['about', 'About this project'], ['story', '1. Story scenarios'], ['segments', '2. Segments and publish'], ['sync', '3. Sync board'], ['api', '4. API explorer'], ['tests', '5. Tests']];
  function renderChrome() {
    var m = document.getElementById('mode');
    m.textContent = MODE === 'live' ? 'Live API: this page is calling the server' : (WAKE_READY ? 'The live server is awake. Click here to switch (resets this page)' : 'Browser simulation: same engine, no server');
    m.className = 'chip ' + (MODE === 'live' ? 'good' : 'warn');
    m.style.cursor = WAKE_READY && MODE !== 'live' ? 'pointer' : ''; m.onclick = WAKE_READY && MODE !== 'live' ? function () { location.reload(); } : null;
    var sel = document.getElementById('actor'); sel.innerHTML = '';
    (state.dstate ? state.dstate.tokens : []).filter(function (t) { return t.role !== 'consumer'; }).forEach(function (t) {
      sel.append(h('option', { value: t.token, selected: t.token === state.token }, t.label));
    });
    document.getElementById('clock').textContent = state.dstate ? 'Hub clock ' + state.dstate.now.slice(11, 19) + ' UTC, catalog rev ' + state.dstate.catalog_rev : '';
    var nav = document.getElementById('tabs'); nav.innerHTML = '';
    TABS.forEach(function (t) { nav.append(h('button', { class: state.tab === t[0] ? 'on' : '', onclick: async function () { state.tab = t[0]; if (t[0] === 'sync') await loadSync(); renderChrome(); render(); } }, t[1])); });
  }
  function renderLog() {
    document.body.classList.toggle('logopen', !!state.logOpen);
    var f = document.getElementById('log'); f.innerHTML = '';
    f.append(h('div', { class: 'row' }, h('b', {}, 'Raw API calls'), h('span', { class: 'muted' }, LOG.length + ' this session. Every button above is one or more of these.'),
      h('button', { class: 'sm', onclick: function () { state.logOpen = !state.logOpen; renderLog(); } }, state.logOpen ? 'Hide' : 'Show')));
    if (!state.logOpen) return;
    var box = h('div', { class: 'calls' });
    LOG.slice(0, 12).forEach(function (c, i) {
      var tone = c.res.status < 300 ? 'good' : c.res.status < 400 ? 'info' : 'bad';
      box.append(h('div', { class: 'call', onclick: function () { state.logSel = state.logSel === i ? null : i; renderLog(); } }, chip(c.res.status, tone), h('span', { class: 'mono' }, c.method + ' ' + c.path), h('span', { class: 'muted' }, c.who + ', ' + c.res.ms + ' ms')));
      if (state.logSel === i) box.append(h('div', { class: 'two' }, h('div', {}, h('div', { class: 'muted' }, 'Request body'), pre(c.reqBody === undefined ? '(none)' : c.reqBody)), h('div', {}, h('div', { class: 'muted' }, 'Response body'), pre(c.res.body === null ? '(empty)' : c.res.body))));
    });
    f.append(box);
  }

  // ---------------------------------------------------------------- story
  function bid(mut) {
    var r = { id: 'req-1', device: { devicetype: 4, os: 'android', geo: { country: 'IND', region: 'IN-WB' } }, site: { domain: 'beauty-blog.example', cat: ['IAB18-1'], cattax: 1 },
      user: { data: [{ id: 'partner_a', segment: [{ id: 'purchase_skincare_30d' }] }] }, regs: { gpp: 'demo-gpp-granted' } };
    if (mut) mut(r); return r;
  }
  function find(list, id) { return (list || []).filter(function (x) { return x.segment_id === id; })[0]; }
  var SCEN = [
    { n: 1, title: 'Consented purchaser on a beauty blog', shows: 'Hard rules pass, then the soft rules pick tier 1', seg: 'seg_glowroot_festive_east', query: {},
      body: bid(function (r) { r.id = 'req-s1'; }),
      facts: ['Kolkata (IN-WB)', 'mobile', 'consent granted', 'bought skincare in 30 days', 'beauty blog'],
      verdict: function (b) { var m = find(b.matches, 'seg_glowroot_festive_east'); return m ? { tone: 'good', head: 'MATCH, tier 1', text: m.reason } : { tone: 'bad', head: 'No match', text: 'Unexpected. Reset the demo and run again.' }; } },
    { n: 2, title: 'Same user, no consent', shows: 'Consent fallback: context only, tier 2', seg: 'seg_glowroot_festive_east', query: {},
      body: bid(function (r) { r.id = 'req-s2'; delete r.regs; }),
      facts: ['Kolkata (IN-WB)', 'mobile', 'no consent string', 'beauty blog'],
      verdict: function (b) { var m = find(b.matches, 'seg_glowroot_festive_east'); return m ? { tone: 'warn', head: 'MATCH, tier 2 (context only)', text: 'Without consent the audience signal is ignored, so the request still qualifies on page context but at lower priority. ' + m.reason } : { tone: 'bad', head: 'No match', text: 'Unexpected.' }; } },
    { n: 3, title: 'Consented purchaser on a made-for-advertising site', shows: 'Exclusion list overrides everything', seg: 'seg_glowroot_festive_east', query: {},
      body: bid(function (r) { r.id = 'req-s3'; r.site.domain = 'cheap-clicks.example'; }),
      facts: ['Kolkata (IN-WB)', 'mobile', 'consent granted', 'site cheap-clicks.example (on excl_mfa)'],
      verdict: function (b) { var e = find(b.excluded, 'seg_glowroot_festive_east'); return e ? { tone: 'bad', head: 'EXCLUDED', text: e.reason } : { tone: 'bad', head: 'Unexpected', text: 'The site should have been excluded.' }; } },
    { n: 4, title: 'Mumbai edge cluster still on an older rule (narrower copy)', shows: 'Stale copy that under-delivers. No pause: alert and refresh', seg: 'seg_glowroot_festive_east', query: { catalog_rev: 4, compare: 'active' },
      body: bid(function (r) { r.id = 'req-s4'; r.device.geo.region = 'IN-OD'; }),
      facts: ['Bhubaneswar (IN-OD)', 'mobile', 'consent granted', 'replayed against catalog rev 4, what the Mumbai cluster holds'],
      verdict: function (b) {
        var d = b.compare && find(b.compare.differences, 'seg_glowroot_festive_east');
        return d ? { tone: 'warn', head: 'DIVERGES: the stale copy rejects what the active version accepts', text: 'The Mumbai cluster holds segment v2 (West Bengal only). The active v3 adds Odisha, so this request is ' + d.held + ' on the stale copy and ' + d.active + ' on the active one. The stale copy is narrower: it under-delivers but does not leak. Policy: never pause it. Raise a P2 alert and force a refresh.' } : { tone: 'bad', head: 'No divergence', text: 'Unexpected. Reset the demo.' };
      }, link: ['sync', 'seg_glowroot_festive_east', 'See it on the sync board'] },
    { n: 5, title: 'Singapore edge cluster missed an exclusion-list update (wider copy)', shows: 'Stale copy that leaks. High risk: pause request, countdown, kill switch', seg: 'seg_glowroot_premium_north', query: { catalog_rev: 3, compare: 'active' },
      body: bid(function (r) { r.id = 'req-s5'; r.device.geo.region = 'IN-DL'; r.site.domain = 'glow-deals-feed.example'; }),
      facts: ['Delhi (IN-DL)', 'mobile', 'consent granted', 'site glow-deals-feed.example, added to excl_mfa in rev 4', 'replayed against catalog rev 3, what the Singapore cluster holds'],
      verdict: function (b) {
        var d = b.compare && find(b.compare.differences, 'seg_glowroot_premium_north');
        return d ? { tone: 'bad', head: 'DIVERGES: the stale copy serves what the active version excludes', text: 'The Singapore cluster is on catalog rev 3, before the site was added to the MFA list. It would be ' + d.held + ' while the active catalog says ' + d.active + '. That is a wider stale copy: a leak and a brand-safety risk. Policy: request a pause. If the cluster cannot be reached, use the kill switch, then the segment\'s local expiry (15 minutes, because this segment is strict).' } : { tone: 'bad', head: 'No divergence', text: 'Unexpected. Reset the demo.' };
      }, link: ['sync', 'seg_glowroot_premium_north', 'See it on the sync board'] }
  ];
  async function runScenario(s) {
    var r = await api('POST', '/v1/match', { token: 'tok_priya_adops', query: s.query, body: s.body });
    state.scen[s.n] = { res: r }; render();
  }
  // ---------------------------------------------------------------- guided replay
  var REPLAY = [
    { t: 'The client complains.', d: 'Their ad ran on a site they excluded. Replay that request against the copy the Singapore cluster holds.' },
    { t: 'The hub sees it.', d: 'Open the sync board for the same segment and read what it says about that cluster.' },
    { t: 'An approver asks for a pause.', d: 'Only high-risk stale copies are targeted. Narrower copies are skipped on purpose.' },
    { t: 'The server confirms.', d: 'The cluster pulls the signed snapshot, applies it and acknowledges.' },
    { t: 'Back in sync.', d: 'Read the board again.' }
  ];
  async function replayStep() {
    var R = state.replay; if (R.busy) return; R.busy = true; render();
    var seg = 'seg_glowroot_premium_north', sg = function (rows) { return rows.filter(function (x) { return x.consumer_id === 'edge_sg_1'; })[0]; };
    try {
      if (R.step === 0) {
        await api('POST', '/v1/demo/reset', { token: null }); state.scen = {};
        var r = await api('POST', '/v1/match', { token: 'tok_priya_adops', query: SCEN[4].query, body: SCEN[4].body });
        var d = r.status === 200 && r.body.compare && find(r.body.compare.differences, seg);
        R.notes.push(d ? 'The request is "' + d.held + '" on the copy the Singapore cluster holds and "' + d.active + '" on the active one. The client was right.' : 'No divergence found. Press Start again.');
        if (!d) R.step = -1;
      } else if (R.step === 1) {
        state.syncSeg = seg; await loadSync();
        var c = sg(state.sync.sync.consumers), sm = state.sync.sync.summary;
        R.notes.push(c.name + ' is ' + c.state.replace('_', ' ') + ': ' + (CLS[c.classification] || [c.classification])[0] + '. About ' + fmtSecs(c.seconds_until_local_expiry) + ' until local expiry. Recommended action: ' + (ACT[c.recommended_action] || c.recommended_action) + '. High-risk stale exposure so far: ' + sm.high_risk_stale_exposure_traffic_minutes + ' traffic-minutes.');
      } else if (R.step === 2) {
        var p = await api('POST', '/v1/segments/' + seg + '/transitions', { token: 'tok_rahul_approver', body: { action: 'pause', reason: 'Replay: wider stale copy on the Singapore cluster' }, headers: { 'idempotency-key': uid() } });
        R.notes.push(p.status === 202 ? 'Rahul requests a pause for ' + p.body.pending.join(', ') + (p.body.skipped && p.body.skipped.length ? ' and skips ' + p.body.skipped.map(function (x) { return x.consumer_id; }).join(', ') + ' (under-delivery only)' : '') + '.' : 'The pause answered ' + p.status + ': ' + errText(p));
      } else if (R.step === 3) {
        var sy = await api('POST', '/v1/demo/consumers/edge_sg_1/sync', { token: null, body: {} });
        R.notes.push(sy.status < 300 ? 'Singapore: ' + sy.body.result + '. It also confirms the pause.' : errText(sy));
      } else if (R.step === 4) {
        await loadSync();
        var c2 = sg(state.sync.sync.consumers), sm2 = state.sync.sync.summary;
        R.notes.push(c2.name + ' is ' + c2.state.replace('_', ' ') + ', pause ' + c2.pause + '. High-risk stale exposure is now ' + sm2.high_risk_stale_exposure_traffic_minutes + '. The incident closed in the time it took to read five steps.');
      }
      if (R.step >= 0) R.step++; else { R.step = 0; R.notes = []; }
      await refreshDemo();
    } finally { R.busy = false; }
    render();
  }
